<script>
// Apni asli Gemini API key yahan dalein
const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY"; 
let currentMode = 'jarvis';

function setMode(mode) {
    currentMode = mode;
    const btnJ = document.getElementById('btnJarvis');
    const btnR = document.getElementById('btnRida');
    if(btnJ) btnJ.classList.toggle('active', mode === 'jarvis');
    if(btnR) btnR.classList.toggle('active', mode === 'rida');

    const statusEl = document.getElementById('statusText');
    if(statusEl) {
        statusEl.innerText = mode === 'jarvis' 
            ? "Active: JARVIS (Cyan Mode)" 
            : "Active: QUEEN RIDA (Encrypted Channel)";
    }

    const greeting = mode === 'jarvis' 
        ? "System online, Sir M Shahban Ali. Ready." 
        : "Hey Shahban! Queen is online. Bolo kya chal raha hai?";
    speak(greeting, mode === 'jarvis');
}

async function askAI(promptText) {
    if (!promptText || promptText.trim() === "") return;
    const isJarvis = currentMode === 'jarvis';
    const displayEl = document.getElementById('chatDisplay');
    if(displayEl) displayEl.innerText = "Processing neural link...";

    const systemPersona = isJarvis 
        ? "You are JARVIS, futuristic robotic AI for Commander M Shahban Ali. Reply short in Roman Urdu/English." 
        : "You are Queen Rida, loving queen talking to Shahban. Reply short in Roman Urdu.";

    if (GEMINI_API_KEY === "YOUR_GEMINI_API_KEY" || !GEMINI_API_KEY) {
        speak("API key configure nahi hai code me, Sir!", isJarvis);
        return;
    }

    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: `${systemPersona}\nUser says: ${promptText}` }] }]
            })
        });
        
        const data = await response.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
        
        if (reply) {
            speak(reply, isJarvis);
        } else {
            speak("AI response empty mila, Sir.", isJarvis);
        }
    } catch (e) {
        speak("Network error: API connect nahi ho rahi.", isJarvis);
    }
}

function speak(text, isJarvis) {
    const displayEl = document.getElementById('chatDisplay');
    if(displayEl) displayEl.innerText = text;
    
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.pitch = isJarvis ? 0.5 : 1.3;
    utterance.rate = 0.95;
    window.speechSynthesis.speak(utterance);
}

// Input box enter key event bind karne ke liye (agar ID 'msgInput' ho):
const inputField = document.getElementById('msgInput') || document.querySelector('input[type="text"]');
if (inputField) {
    inputField.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            askAI(this.value);
            this.value = '';
        }
    });
}
</script>
